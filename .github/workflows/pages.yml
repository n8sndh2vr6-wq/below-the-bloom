name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # This step is mostly spent waiting in GitHub's own deployment
          # queue, and it prints "deployment_queued" once a second while it
          # does. A run on 6 Aug queued for 7m49s against the 10-minute
          # default and only just made it, so allow twenty and poll less
          # noisily. Neither setting affects how fast the site publishes.
          timeout: 1200000
          reporting_interval: 10000
