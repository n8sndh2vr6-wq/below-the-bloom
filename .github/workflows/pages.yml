name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # The deploy step does no work itself — it hands the artifact to
      # GitHub's Pages service and polls until the deployment goes live.
      # On 6 Aug that queue stalled for over half an hour at a time while
      # the status page stayed green, so: a generous timeout, quiet
      # polling, and one fresh attempt if the first deployment times out.
      # A cancelled deployment is cleaned up by the action itself, so the
      # retry starts clean.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          reporting_interval: 15000

      - name: Deploy to GitHub Pages (second attempt)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          reporting_interval: 15000
